
      - name: Guardar atualizacoes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.json

          if git diff --cached --quiet; then
            echo "Sem alteracoes para publicar"
            exit 0
          fi

          git commit -m "Atualizacao automatica do feed"

          for tentativa in 1 2 3; do
            echo "Tentativa $tentativa de sincronizacao"

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Feed atualizado com sucesso"
                exit 0
              fi
            else
              git rebase --abort || true
              echo "::error::Conflito de ficheiros. Revisao necessaria."
              exit 1
            fi

            sleep 5
          done

          echo "::error::Nao foi possivel publicar o feed"
          exit 1
