
name: 24 Noticias - Atualizacao Automatica

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  atualizar:
    name: Atualizar noticias e meteorologia
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter ficheiros do repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Verificar motor de noticias
        shell: bash
        run: |
          if [ ! -f update_feed.py ]; then
            echo "::error::Ficheiro update_feed.py nao encontrado"
            exit 1
          fi

          python -m py_compile update_feed.py

      - name: Executar testes editoriais
        shell: bash
        run: |
          python -m unittest discover \
            -p "test_*.py" \
            -v

      - name: Atualizar noticias
        shell: bash
        run: |
          python update_feed.py

      - name: Validar feed JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          feed = Path("feed.json")

          if not feed.exists():
              raise SystemExit("ERRO: feed.json nao existe")

          with feed.open(encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, (dict, list)):
              raise SystemExit("ERRO: estrutura JSON invalida")

          print("Feed JSON valido")
          PY

      - name: Guardar atualizacoes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.json

          if git diff --cached --quiet; then
            echo "Sem alteracoes para publicar"
          else
            git commit -m "Atualizacao automatica do feed"
            git push origin HEAD:main
          fi
