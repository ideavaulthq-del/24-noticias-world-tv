
name: 24 Noticias - Atualizacao Automatica

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  atualizar:
    name: Atualizar noticias e meteorologia
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter ficheiros
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Verificar motor
        run: |
          python -m py_compile update_feed.py

      - name: Executar testes editoriais
        run: |
          python -m unittest discover -p "test_*.py" -v

      - name: Atualizar noticias
        run: |
          python update_feed.py

      - name: Validar feed
        run: |
          python -m json.tool feed.json > /dev/null

      - name: Guardar atualizacoes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.json

          if git diff --cached --quiet; then
            echo "Sem alteracoes para publicar"
            exit 0
          fi

          git commit -m "Atualizacao automatica do feed"

          for tentativa in 1 2 3; do
            echo "Tentativa $tentativa"

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Feed publicado com sucesso"
                exit 0
              fi
            else
              git rebase --abort || true
              echo "::error::Conflito de ficheiros"
              exit 1
            fi

            sleep 5
          done

          echo "::error::Falha ao publicar o feed"
          exit 1
